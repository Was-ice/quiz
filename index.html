<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<title>AI 出题 · 智能答题</title>
<style>
:root{
  --text:#e8ecf5;--dim:#8a93a8;--dim2:#5a6478;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --green:#34d399;--red:#f87171;--gold:#fbbf24;
  --mask:.55;
  --purple:#7c5cff;--cyan:#22d3ee;
  --purple-rgba:rgba(124,92,255,.20);
  --cyan-rgba:rgba(34,211,238,.14);
  --mask-color:#0d0820;
  --card-1:rgba(25,20,48,.86);
  --card-2:rgba(14,10,32,.82);
  --header-bg:rgba(10,7,24,.94);
  --header-bg2:rgba(10,7,24,.55);
  --nav-bg:rgba(20,15,40,.9);
  --sheet-1:#191335;
  --sheet-2:#0e0a22;
}
.theme-purple{--purple:#7c5cff;--cyan:#22d3ee;--purple-rgba:rgba(124,92,255,.20);--cyan-rgba:rgba(34,211,238,.14);--mask-color:#0d0820;--card-1:rgba(25,20,48,.86);--card-2:rgba(14,10,32,.82);--header-bg:rgba(10,7,24,.94);--header-bg2:rgba(10,7,24,.55);--nav-bg:rgba(20,15,40,.9);--sheet-1:#191335;--sheet-2:#0e0a22}
.theme-green{--purple:#10b981;--cyan:#34d399;--purple-rgba:rgba(16,185,129,.22);--cyan-rgba:rgba(52,211,153,.14);--mask-color:#051a10;--card-1:rgba(14,34,24,.86);--card-2:rgba(7,22,14,.82);--header-bg:rgba(4,18,11,.94);--header-bg2:rgba(4,18,11,.55);--nav-bg:rgba(12,32,20,.9);--sheet-1:#0f2a1c;--sheet-2:#061810}
.theme-red{--purple:#ef4444;--cyan:#f97316;--purple-rgba:rgba(239,68,68,.22);--cyan-rgba:rgba(249,115,22,.16);--mask-color:#1a0606;--card-1:rgba(40,15,15,.86);--card-2:rgba(26,8,8,.82);--header-bg:rgba(20,5,5,.94);--header-bg2:rgba(20,5,5,.55);--nav-bg:rgba(38,14,14,.9);--sheet-1:#2a1010;--sheet-2:#180808}
.theme-gold{--purple:#f59e0b;--cyan:#fbbf24;--purple-rgba:rgba(245,158,11,.22);--cyan-rgba:rgba(251,191,36,.16);--mask-color:#1a1105;--card-1:rgba(40,29,13,.86);--card-2:rgba(26,19,8,.82);--header-bg:rgba(20,14,5,.94);--header-bg2:rgba(20,14,5,.55);--nav-bg:rgba(38,28,12,.9);--sheet-1:#2a1d0a;--sheet-2:#180f05}
.theme-blue{--purple:#3b82f6;--cyan:#0ea5e9;--purple-rgba:rgba(59,130,246,.22);--cyan-rgba:rgba(14,165,233,.16);--mask-color:#05101f;--card-1:rgba(14,25,44,.86);--card-2:rgba(8,16,30,.82);--header-bg:rgba(5,11,22,.94);--header-bg2:rgba(5,11,22,.55);--nav-bg:rgba(12,22,40,.9);--sheet-1:#101d34;--sheet-2:#06101f}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 8% -8%,var(--purple-rgba),transparent 62%),
    radial-gradient(800px 560px at 96% 2%,var(--cyan-rgba),transparent 62%),
    linear-gradient(180deg,#0a0d16 0%,#0d1220 45%,#0a0d16 100%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6;
  transition:background .5s ease;
}
.bg-layer,.bg-mask{position:fixed;inset:0;z-index:-2;pointer-events:none}
.bg-layer{background-size:cover;background-position:center;background-repeat:no-repeat;display:none}
.bg-layer.on{display:block}
.bg-mask{z-index:-1;background:var(--mask-color);opacity:var(--mask);display:none;transition:background .5s ease}
.bg-mask.on{display:block}
.app{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{
  position:sticky;top:0;z-index:50;margin:0 -16px 14px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,var(--header-bg) 0%,var(--header-bg2) 70%,transparent 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.logo{
  width:42px;height:42px;flex:none;border-radius:13px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;
  box-shadow:0 6px 20px var(--purple-rgba);
}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em}
.brand p{margin:1px 0 0;font-size:11px;color:var(--dim2);letter-spacing:.12em}
.icon-btn{
  margin-left:auto;width:42px;height:42px;flex:none;
  border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.card{
  border-radius:22px;
  background:linear-gradient(160deg,var(--card-1),var(--card-2));
  border:1px solid var(--line);box-shadow:0 18px 46px rgba(0,0,0,.5);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:22px 18px;
}
.intro{text-align:center;padding:36px 22px}
.intro .big{
  width:74px;height:74px;margin:0 auto 18px;border-radius:24px;
  background:linear-gradient(135deg,var(--purple-rgba),var(--cyan-rgba));
  border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:32px;
}
.intro h2{margin:0 0 8px;font-size:18px;letter-spacing:.06em}
.intro p{margin:0 0 22px;font-size:13px;color:var(--dim);line-height:1.9}
.btn{
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;
  padding:13px 22px;border-radius:14px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--text);
  cursor:pointer;transition:all .18s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn.primary{
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  border:none;color:#fff;box-shadow:0 8px 26px var(--purple-rgba);
}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.loading{text-align:center;padding:52px 20px}
.ring{
  width:52px;height:52px;margin:0 auto 20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.08);
  border-top-color:var(--purple);border-right-color:var(--cyan);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading .txt{font-size:13px;color:var(--dim);letter-spacing:.16em}
.loading .sub{font-size:11px;color:var(--dim2);margin-top:8px;letter-spacing:.1em}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chip{
  font-size:11px;letter-spacing:.1em;padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--line);
}
.chip.p{color:var(--purple);border-color:var(--purple-rgba);background:var(--purple-rgba)}
.chip.c{color:var(--cyan);border-color:var(--cyan-rgba);background:var(--cyan-rgba)}
.chip.g{color:#fcd34d;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.chip.r{color:#fca5a5;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.q-text{font-size:17px;line-height:1.75;font-weight:500;margin:0 0 16px;white-space:pre-wrap}
.hint-row{margin:0 0 16px}
.hint-btn{
  font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.08em;
  padding:8px 14px;border-radius:11px;
  border:1px dashed rgba(251,191,36,.45);
  background:rgba(251,191,36,.06);color:#fcd34d;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.hint-box{
  padding:12px 14px;border-radius:12px;
  background:rgba(251,191,36,.08);
  border:1px solid rgba(251,191,36,.28);
  color:#fde6b0;font-size:13px;line-height:1.75;
}
.hint-box .h-head{font-size:11px;letter-spacing:.2em;color:#fcd34d;margin-bottom:6px;font-weight:600}
.options{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  font-family:inherit;font-size:15px;line-height:1.55;
  text-align:left;padding:14px 15px;border-radius:15px;
  border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);
  cursor:pointer;
}
.opt .k{
  flex:none;width:26px;height:26px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;background:rgba(255,255,255,.07);color:var(--dim);
}
.opt.right{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.1)}
.opt.right .k{background:var(--green);color:#062b1e}
.opt.wrong{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.1)}
.opt.wrong .k{background:var(--red);color:#2b0808}
.opt.done{cursor:default}
.fill-row{display:flex;gap:9px}
.fill-row input{
  flex:1;min-width:0;font-family:inherit;font-size:16px;
  padding:14px 15px;border-radius:15px;
  background:rgba(255,255,255,.04);color:var(--text);
  border:1px solid var(--line);outline:none;
}
.fill-row input:focus{border-color:var(--purple)}
.fill-row input:disabled{opacity:.6}
.short-ta{
  width:100%;min-height:140px;font-family:inherit;font-size:15px;
  padding:14px 15px;border-radius:15px;
  background:rgba(255,255,255,.04);color:var(--text);
  border:1px solid var(--line);outline:none;
  resize:vertical;line-height:1.75;box-sizing:border-box;
}
.short-ta.essay{min-height:260px}
.short-ta:focus{border-color:var(--purple)}
.short-ta:disabled{opacity:.6}
.short-meta{font-size:11.5px;color:var(--dim2);letter-spacing:.06em;margin:8px 0 12px;padding-left:4px;line-height:1.6}
.short-char-count{float:right}
.short-char-count.near{color:var(--green)}
.short-char-count.over{color:var(--gold)}
.short-result{margin-top:16px;padding:16px;border-radius:15px}
.short-result.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}
.short-result.no{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3)}
.short-result .score-row{display:flex;align-items:baseline;gap:5px;margin-bottom:14px}
.short-result .score-big{font-size:44px;font-weight:800;line-height:1;color:var(--gold)}
.short-result.ok .score-big{color:var(--green)}
.short-result.no .score-big{color:var(--red)}
.short-result .score-total{font-size:18px;font-weight:600;color:var(--dim)}
.short-result .score-tag{margin-left:auto;font-size:11px;letter-spacing:.16em;padding:4px 10px;border-radius:999px}
.short-result.ok .score-tag{color:var(--green);background:rgba(52,211,153,.12)}
.short-result.no .score-tag{color:var(--red);background:rgba(248,113,113,.12)}
.short-result .comment{font-size:13.5px;line-height:1.75;color:var(--text);padding:11px 13px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:12px;border-left:3px solid var(--purple)}
.short-result .ans-points{padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:10px}
.short-result .ap-head{font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px}
.short-result .ap-item{font-size:13px;line-height:1.8;color:var(--text);padding:2px 0}
.short-result .explain-body{font-size:12.5px;line-height:1.8;color:var(--dim);padding-top:8px;border-top:1px solid var(--line);margin-top:8px}
.explain{margin-top:16px;padding:15px 16px;border-radius:15px;font-size:13.5px;line-height:1.8;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.explain .head{font-weight:700;letter-spacing:.08em;margin-bottom:7px;font-size:13px}
.explain.ok .head{color:var(--green)}
.explain.no .head{color:var(--red)}
.explain .ans{color:var(--gold);font-weight:600}
.explain .body{color:var(--dim);font-size:12.5px;line-height:1.85}
.explain .alias{font-size:11.5px;color:var(--dim2);margin-top:5px;line-height:1.7}
.stats{display:flex;gap:8px;margin-top:14px;padding:10px;border-radius:18px;background:var(--nav-bg);border:1px solid var(--line)}
.stats .s{flex:1;text-align:center;padding:6px 2px}
.stats .s span{display:block;font-size:10px;color:var(--dim2);letter-spacing:.16em;margin-bottom:3px}
.stats .s b{font-size:17px;font-weight:700}
.stats .s b.g{color:var(--green)}
.stats .s b.r{color:var(--red)}
.stats .s b.y{color:var(--gold)}
.theme-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.theme-btn{font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
.theme-btn.on{border-color:var(--purple);background:var(--purple-rgba);box-shadow:0 4px 14px var(--purple-rgba)}
.theme-dot{width:28px;height:28px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.15)}
.theme-btn .theme-name{font-size:10.5px;letter-spacing:.05em;color:var(--dim);white-space:nowrap}
.theme-btn.on .theme-name{color:var(--text);font-weight:600}
.subj-pool{padding:12px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.subj-section{display:flex;flex-direction:column;gap:7px}
.subj-head{font-size:10.5px;letter-spacing:.18em;color:var(--dim);display:flex;align-items:center;gap:6px}
.subj-head .count{margin-left:auto;font-size:10px;color:var(--dim2)}
.subj-head .hint-inline{font-size:9.5px;color:var(--dim2);font-weight:400}
.subj-chips{display:flex;flex-wrap:wrap;gap:6px;padding:9px;border-radius:11px;background:rgba(0,0,0,.18);min-height:44px;align-content:flex-start}
.subj-chips.available{background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.06);max-height:180px;overflow-y:auto}
.subj-chip{font-family:inherit;font-size:12.5px;padding:7px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--dim);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;line-height:1}
.subj-chip.on{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;border-color:transparent;font-weight:600;box-shadow:0 3px 10px var(--purple-rgba)}
.subj-chip.on .x{display:inline-block;width:14px;height:14px;line-height:13px;border-radius:50%;background:rgba(0,0,0,.25);color:#fff;font-size:11px;font-weight:700;text-align:center;margin-left:1px}
.subj-chip.custom-flag::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold);display:inline-block;margin-left:2px;box-shadow:0 0 5px var(--gold)}
.subj-chip.add{border-style:dashed;border-color:var(--purple);color:var(--purple);background:var(--purple-rgba)}
.subj-empty{font-size:11px;color:var(--dim2);letter-spacing:.1em;padding:8px 4px;line-height:1.5}
.filter-panel{padding:16px;border-radius:18px;background:linear-gradient(160deg,var(--card-1),var(--card-2));border:1px solid var(--line);margin-bottom:14px}
.filter-panel .row{margin-bottom:12px}
.filter-panel .row:last-child{margin-bottom:0}
.filter-panel label{display:block;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:7px;padding-left:2px}
.kw-input{width:100%;font-family:inherit;font-size:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.045);color:var(--text);border:1px solid var(--line);outline:none}
.kw-input:focus{border-color:var(--purple)}
.point-list{display:flex;flex-direction:column;gap:10px}
.point-card{padding:16px;border-radius:16px;background:linear-gradient(160deg,var(--card-1),var(--card-2));border:1px solid var(--line);cursor:pointer}
.point-card .p-title{font-size:15px;font-weight:600;margin:0 0 6px;color:var(--text)}
.point-card .p-brief{font-size:12.5px;line-height:1.7;color:var(--dim);margin:0 0 10px}
.point-card .p-tags{display:flex;flex-wrap:wrap;gap:5px}
.point-card .p-tag{font-size:10.5px;padding:3px 8px;border-radius:999px;background:var(--purple-rgba);color:var(--purple);border:1px solid var(--purple-rgba)}
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.detail-head .back-btn{width:38px;height:38px;flex:none;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.detail-head .back-btn svg{width:18px;height:18px;fill:currentColor}
.detail-head h2{margin:0;font-size:16px;letter-spacing:.05em;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.style-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.style-chips .sc{font-size:10.5px;padding:4px 10px;border-radius:999px;background:var(--cyan-rgba);color:var(--cyan);border:1px solid var(--cyan-rgba)}
.exp-h{font-size:14px;font-weight:700;color:var(--purple);margin:18px 0 8px}
.exp-h:first-child{margin-top:0}
.exp-p{font-size:14px;line-height:1.85;color:var(--text);margin:0 0 12px}
.exp-li{font-size:13.5px;line-height:1.8;color:var(--text);margin:0 0 6px;padding-left:6px}
.ex-section-title{font-size:14px;font-weight:700;color:var(--cyan);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.ex-card{padding:16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line);margin-bottom:12px}
.ex-num{font-size:11px;letter-spacing:.2em;color:var(--dim2);margin-bottom:8px}
.ex-q{font-size:14.5px;line-height:1.7;color:var(--text);margin:0 0 12px}
.ex-opts{display:flex;flex-direction:column;gap:8px}
.ex-opt{display:flex;align-items:flex-start;gap:10px;font-family:inherit;font-size:14px;line-height:1.55;text-align:left;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer}
.ex-opt .k{flex:none;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.07);color:var(--dim)}
.ex-opt.right{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.1)}
.ex-opt.right .k{background:var(--green);color:#062b1e}
.ex-opt.wrong{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.1)}
.ex-opt.wrong .k{background:var(--red);color:#2b0808}
.ex-fill-row{display:flex;gap:8px}
.ex-fill-row input{flex:1;min-width:0;font-family:inherit;font-size:15px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line);outline:none}
.ex-fill-row button{padding:11px 16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ex-result{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:12.5px;line-height:1.75}
.ex-result.ok{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:#cfe8cf}
.ex-result.no{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#f0c5c5}
.ex-result .head{font-weight:700;margin-bottom:5px}
.ex-result.ok .head{color:var(--green)}
.ex-result.no .head{color:var(--red)}
.ex-result .ans{color:var(--gold);font-weight:600}
.ex-result .body{color:var(--dim);font-size:12px;margin-top:5px;line-height:1.75}
.hist-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hist-head h2{margin:0;font-size:16px;font-weight:700}
.hist-head .count{font-size:11px;color:var(--dim2)}
.hist-list{display:flex;flex-direction:column;gap:10px}
.hist-item{padding:14px 15px;border-radius:16px;background:linear-gradient(160deg,var(--card-1),var(--card-2));border:1px solid var(--line)}
.hist-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.hist-badge{font-size:10px;padding:3px 9px;border-radius:999px;font-weight:600}
.hist-badge.ok{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.35)}
.hist-badge.no{background:rgba(248,113,113,.15);color:#fca5a5;border:1px solid rgba(248,113,113,.35)}
.hist-badge.score{background:rgba(251,191,36,.15);color:#fcd34d;border:1px solid rgba(251,191,36,.35)}
.hist-time{font-size:10.5px;color:var(--dim2);margin-left:auto}
.hist-subj{font-size:10.5px;color:var(--purple)}
.hist-q{font-size:13.5px;line-height:1.65;color:var(--text);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist-ans{font-size:12px;color:var(--dim);line-height:1.7}
.hist-ans .ok{color:#6ee7b7}
.hist-ans .no{color:#fca5a5}
.hist-ans .gold{color:var(--gold)}
.empty-hist{text-align:center;padding:70px 20px;color:var(--dim2);font-size:13px;line-height:2}
.empty-hist .icon{font-size:42px;opacity:.4;margin-bottom:12px}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:8px;justify-content:center;
  background:linear-gradient(180deg,transparent,var(--header-bg) 42%);
  pointer-events:none;
}
.bottom-nav .inner{
  display:flex;gap:4px;padding:6px;border-radius:18px;
  background:var(--nav-bg);border:1px solid var(--line2);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  pointer-events:auto;
}
.tab-btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:13px;border:none;background:transparent;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab-btn.on{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;box-shadow:0 6px 18px var(--purple-rgba)}
.tab-btn svg{width:15px;height:15px;fill:currentColor}

/* ===== 关键修复：设置弹窗 ===== */
.modal{
  position:fixed;inset:0;z-index:200;background:rgba(4,7,13,.72);
  opacity:0;pointer-events:none;transition:opacity .24s;
}
.modal.show{opacity:1;pointer-events:auto}

.sheet{
  position:fixed;
  left:0;right:0;bottom:0;
  margin:0 auto;
  width:100%;
  max-width:100%;
  max-height:88vh;
  max-height:88dvh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,var(--sheet-1),var(--sheet-2));
  border-radius:26px 26px 0 0;
  border-top:1px solid var(--line2);
  transform:translateY(100%);
  transition:transform .34s cubic-bezier(.22,1,.36,1);
  overflow:hidden;
}
.modal.show .sheet{transform:translateY(0)}

.sheet-body{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:22px 18px 12px;
}
.sheet-body::-webkit-scrollbar{width:5px}
.sheet-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}

.sheet-footer{
  flex:0 0 auto;
  padding:12px 18px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.35));
  display:flex;flex-direction:column;gap:9px;
}

.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .hint{margin:0 0 20px;font-size:12px;color:var(--dim2);line-height:1.8}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px;padding-left:2px}
.field .wrap{position:relative;display:flex;align-items:center}
.field input[type=text],.field input[type=password]{
  width:100%;font-family:inherit;font-size:15px;padding:13px 15px;border-radius:14px;
  background:rgba(255,255,255,.045);color:var(--text);
  border:1px solid var(--line);outline:none;
}
.field input:focus{border-color:var(--purple)}
.field .eye{position:absolute;right:6px;width:40px;height:40px;border:none;background:transparent;color:var(--dim2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.chip-grid{display:grid;gap:6px}
.chip-grid.c4{grid-template-columns:repeat(4,1fr)}
.chip-grid.c3{grid-template-columns:repeat(3,1fr)}
.chip-pick{font-family:inherit;font-size:12.5px;padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;text-align:center}
.chip-pick.on{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--purple-rgba)}
.bg-block{padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.bg-preview{width:100%;height:90px;border-radius:11px;background:rgba(255,255,255,.03) center/cover no-repeat;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--dim2);font-size:12px;margin-bottom:10px}
.bg-preview.has-img{border-style:solid}
.bg-actions{display:flex;gap:8px}
.bg-actions label,.bg-actions button{flex:1;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:13px;font-weight:600;padding:11px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer}
.bg-actions button{background:rgba(255,255,255,.04);color:var(--dim)}
.bg-actions input[type=file]{display:none}
.mask-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.mask-row span{font-size:11px;color:var(--dim);white-space:nowrap}
.mask-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.12);outline:none}
.mask-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));cursor:pointer}
.backup-row{display:flex;gap:8px;margin-bottom:10px}
.backup-row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:calc(100% - 40px);padding:13px 18px;border-radius:14px;font-size:13px;background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.45);color:#ffd5d5;box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .28s;z-index:300;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ta{width:100%;min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.6;padding:12px;border-radius:12px;background:rgba(0,0,0,.35);color:var(--text);border:1px solid var(--line);outline:none;resize:vertical;word-break:break-all}
.ta:focus{border-color:var(--purple)}
@media(min-width:600px){
  .sheet{max-width:540px}
}
</style>

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 3600);
}
function esc(s){ return String(s == null ? '' : s); }
function normalize(s){
  return String(s == null ? '' : s).trim().toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[，。、；：""''（）()【】《》！？!?,.;:'"\-_·、]/g,'');
}
function fmtTime(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function pickRandomSubject(arr){
  if(!arr || !arr.length) return '全随机';
  return arr[Math.floor(Math.random() * arr.length)];
}
function subjectToPromptDesc(name){
  if(name === '全随机') return '任意学科（每次可随机变化，鼓励跨学科多样性）';
  return name;
}

function loadCfg(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const c = JSON.parse(raw);
      if(c.subject !== undefined && c.selectedSubjects === undefined){
        c.selectedSubjects = [c.subject];
      }
      if(c.type !== undefined && c.types === undefined){
        if(c.type === '选择题') c.types = ['choice'];
        else if(c.type === '填空题') c.types = ['fill'];
        else c.types = ['choice', 'fill'];
      }
      Object.keys(state).forEach(k=>{ if(c[k] !== undefined) state[k] = c[k]; });
    }
  }catch(e){}
  if(!Array.isArray(state.selectedSubjects) || !state.selectedSubjects.length){
    state.selectedSubjects = ['全随机'];
  }
  if(!Array.isArray(state.customSubjects)) state.customSubjects = [];
  if(!Array.isArray(state.types) || !state.types.length){
    state.types = ['choice', 'fill'];
  }
  state.types = state.types.filter(t => TYPE_OPTIONS.find(o => o.id === t));
  if(!state.types.length) state.types = ['choice'];
  if(SHORT_INTENSITIES.indexOf(state.shortIntensity) === -1) state.shortIntensity = '短篇';
  if(!THEMES.find(t => t.id === state.theme)) state.theme = 'purple';
}

function openBGDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(BG_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(BG_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await openBGDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BG_STORE, 'readwrite');
    tx.objectStore(BG_STORE).put(val, key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  try{
    const db = await openBGDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(BG_STORE, 'readonly');
      const req = tx.objectStore(BG_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return undefined; }
}
async function idbDel(key){
  try{
    const db = await openBGDB();
    return new Promise((resolve) => {
      const tx = db.transaction(BG_STORE, 'readwrite');
      tx.objectStore(BG_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  }catch(e){}
}

function qFingerprint(q){ return normalize(q.question).slice(0, 60); }
function isSeen(q){
  const fp = qFingerprint(q);
  if(!fp) return false;
  for(let i = 0; i < seenQuestions.length; i++){
    if(normalize(seenQuestions[i].text).slice(0, 60) === fp) return true;
  }
  return false;
}
function markSeen(q){
  seenQuestions.push({ text: q.question, t: Date.now() });
  if(seenQuestions.length > MAX_SEEN) seenQuestions = seenQuestions.slice(-MAX_SEEN);
  saveSeen();
}

let audioCtx = null;
function initAudio(){
  if(audioCtx) return;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function beep(freq, dur, type, vol, delay){
  if(!audioCtx) return;
  const t = audioCtx.currentTime + (delay||0);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol||0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+dur);
}
const sfx = {
  right(){ beep(660,0.1,'sine',0.09); beep(990,0.16,'sine',0.08,0.09); },
  wrong(){ beep(240,0.14,'square',0.05); beep(180,0.2,'square',0.04,0.12); },
  tap(){ beep(720,0.035,'sine',0.05); },
  hint(){ beep(880,0.06,'sine',0.06); beep(1170,0.1,'sine',0.05,0.06); },
  done(){ beep(523,0.1,'sine',0.07); beep(659,0.1,'sine',0.07,0.08); beep(784,0.16,'sine',0.07,0.16); }
};

async function callAPI(messages, jsonMode){
  const url = state.baseUrl.replace(/\/+$/,'') + '/chat/completions';
  const body = {
    model: 'deepseek-chat',
    messages: messages,
    temperature: 1.2,
    max_tokens: 3600
  };
  if(jsonMode) body.response_format = { type: 'json_object' };

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + state.apiKey
    },
    body: JSON.stringify(body)
  });

  if(!res.ok){
    let detail = '';
    try{
      const j = await res.json();
      detail = (j.error && (j.error.message || j.error.type)) || JSON.stringify(j).slice(0,180);
    }catch(e){
      detail = (await res.text().catch(()=>'')).slice(0,180);
    }
    if(res.status === 401) throw new Error('API Key 无效或已过期，请检查后重填');
    if(res.status === 402) throw new Error('账户余额不足，请到 DeepSeek 官网充值');
    if(res.status === 429) throw new Error('请求太频繁，请稍后再试');
    throw new Error('接口错误 ' + res.status + (detail ? '：' + detail : ''));
  }

  const data = await res.json();
  const txt = data && data.choices && data.choices[0] &&
              data.choices[0].message && data.choices[0].message.content;
  if(!txt) throw new Error('接口返回内容为空');
  return txt;
}

function extractJSON(text){
  let s = String(text).trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence) s = fence[1].trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a !== -1 && b !== -1 && b > a) s = s.slice(a, b+1);
  return JSON.parse(s);
}

function sanitizeAliases(a){
  if(!a) return [];
  if(typeof a === 'string') a = [a];
  if(!Array.isArray(a)) return [];
  const out = [];
  a.forEach(x=>{
    const s = String(x == null ? '' : x).trim();
    if(s && out.indexOf(s) === -1) out.push(s);
  });
  return out;
}

function sanitizeQuestion(q){
  if(!q || typeof q !== 'object') return null;
  const question = String(q.question || '').trim();
  if(!question) return null;

  let type = String(q.type || '').toLowerCase();
  if(['choice','fill','short'].indexOf(type) === -1){
    if(Array.isArray(q.options) && q.options.length) type = 'choice';
    else if(Array.isArray(q.answerPoints) && q.answerPoints.length) type = 'short';
    else type = 'fill';
  }

  const hint = String(q.hint || '').trim();
  const explanation = String(q.explanation || '').trim();

  if(type === 'choice'){
    const opts = Array.isArray(q.options) ? q.options.map(o => String(o).trim()).filter(Boolean) : [];
    if(opts.length < 2) return null;
    let ans = q.answer;
    if(typeof ans === 'string'){
      const trimmed = ans.trim();
      const letter = trimmed.toUpperCase();
      if(letter.length === 1 && letter >= 'A' && letter <= 'Z'){
        const idx = letter.charCodeAt(0) - 65;
        if(idx >= 0 && idx < opts.length) ans = idx;
      }
      if(typeof ans === 'string'){
        const found = opts.findIndex(o => normalize(o) === normalize(trimmed));
        ans = found !== -1 ? found : 0;
      }
    }
    ans = parseInt(ans, 10);
    if(isNaN(ans) || ans < 0 || ans >= opts.length) ans = 0;
    return { type: 'choice', question, options: opts, answer: ans, aliases: [], hint, explanation };
  }

  if(type === 'fill'){
    const ansText = String(q.answer == null ? '' : q.answer).trim();
    if(!ansText) return null;
    return { type: 'fill', question, answer: ansText, aliases: sanitizeAliases(q.aliases), hint, explanation };
  }

  let points = Array.isArray(q.answerPoints)
    ? q.answerPoints.map(x => String(x == null ? '' : x).trim()).filter(Boolean)
    : [];
  if(!points.length){
    const ansText = String(q.answer == null ? '' : q.answer).trim();
    if(ansText) points = [ansText];
  }
  if(!points.length) return null;
  return { type: 'short', question, answerPoints: points.slice(0, 6), hint, explanation };
}

async function generateQuestions(n, subjectName){
  const results = [];
  let attempts = 0;
  while(results.length < n && attempts < 3){
    attempts++;
    const need = n - results.length;
    let data;
    try{
      const raw = await callAPI(buildPrompt(need, subjectName), true);
      data = extractJSON(raw);
    }catch(e){
      if(attempts >= 3 && !results.length) throw e;
      continue;
    }
    let list = data && (data.questions || data.list || data.data);
    if(!Array.isArray(list)) list = [data];
    for(let i = 0; i < list.length; i++){
      const q = sanitizeQuestion(list[i]);
      if(!q) continue;
      if(state.types.indexOf(q.type) === -1) continue;
      if(isSeen(q)) continue;
      markSeen(q);
      q._subject = subjectName;
      results.push(q);
      if(results.length >= n) break;
    }
  }
  if(!results.length) throw new Error('AI 连续返回重复题，请点重试或换个科目');
  return results;
}

async function fillQueue(){
  if(generating) return;
  if(queue.length >= 2) return;
  generating = true;
  try{
    const need = Math.max(2, 3 - queue.length);
    const subjectName = pickRandomSubject(state.selectedSubjects);
    const qs = await generateQuestions(need, subjectName);
    queue = queue.concat(qs);
  }catch(e){
  }finally{
    generating = false;
  }
}

function toNum(s){
  if(typeof s !== 'string') return null;
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function isAnswerMatch(userText, q){
  const u = normalize(userText);
  if(!u) return false;
  const candidates = [q.answer];
  if(Array.isArray(q.aliases)) candidates.push.apply(candidates, q.aliases);
  for(let i = 0; i < candidates.length; i++){
    if(normalize(candidates[i]) === u) return true;
  }
  const un = toNum(u);
  if(un !== null){
    for(let i = 0; i < candidates.length; i++){
      const cn = toNum(normalize(candidates[i]));
      if(cn !== null && Math.abs(un - cn) < 1e-9) return true;
    }
  }
  for(let i = 0; i < candidates.length; i++){
    const c = normalize(candidates[i]);
    if(c.length < 2 || u.length < 2) continue;
    const longer = u.length >= c.length ? u : c;
    const shorter = u.length >= c.length ? c : u;
    if(longer.length - shorter.length <= 3 && longer.indexOf(shorter) !== -1) return true;
  }
  return false;
}

  const pointsText = q.answerPoints.map((p, i) => (i + 1) + '. ' + p).join('\n');
  const charCount = userText.length;

  let messages;
  if(intensity === '相关文章'){
    const min = ESSAY_RANGE.min, max = ESSAY_RANGE.max;
    messages = [
      { role: 'system', content: '你是一位经验丰富的语文/学科写作老师，擅长批改各种文章和小论文。你只返回 JSON，不返回任何多余文字。' },
      { role: 'user', content:
`请对以下写作任务打分。

【写作题目】
${q.question}

【优秀文章应具备的要素】
${pointsText}

【学生作品】（共 ${charCount} 字）
${userText}

【字数要求】
${min}-${max} 字

【评分维度】（满分 10 分）
1. 切题度（2 分）
2. 结构（2 分）
3. 内容充实度（3 分）
4. 语言表达（2 分）
5. 字数达成（1 分）

请返回 JSON：
{ "score": 7.5, "total": 10, "comment": "点评文本" }` }
    ];
  }else{
    messages = [
      { role: 'system', content: '你是一位严谨但宽容的批改老师，擅长根据学生实际水平给分。你只返回 JSON，不返回任何多余文字。' },
      { role: 'user', content:
`请对以下简答题作答打分。

【题目】
${q.question}

【参考答案要点】
${pointsText}

【期望回答强度】
${intensity}（${intensityDesc}）

【学生回答】
${userText}

请返回 JSON：
{ "score": 7.5, "total": 10, "comment": "点评文本" }` }
    ];
  }

  const raw = await callAPI(messages, true);
  const data = extractJSON(raw);

  let score = parseFloat(data.score);
  let total = parseFloat(data.total);
  if(isNaN(total) || total <= 0) total = 10;
  if(isNaN(score)) score = 0;
  if(score < 0) score = 0;
  if(score > total) score = total;

  return {
    score: Math.round(score * 10) / 10,
    total: Math.round(total * 10) / 10,
    comment: String(data.comment || '').trim()
  };
}

function renderSubjectPool(containerEl, selectedArr, customArr, onChange){
  const allSubjects = BASE_SUBJECTS.concat(customArr);
  const available = allSubjects.filter(s => selectedArr.indexOf(s) === -1);

  let html = '';
  html += '<div class="subj-section">';
  html += '<div class="subj-head">已 选 <span class="hint-inline">· 随机抽一个生成</span>';
  html += '<span class="count">' + selectedArr.length + ' 个</span></div>';
  html += '<div class="subj-chips" id="subjSelectedChips">';
  if(selectedArr.length === 0){
    html += '<span class="subj-empty">点击下方科目加入，至少选一个</span>';
  }else{
    selectedArr.forEach(s => {
      html += '<button type="button" class="subj-chip on" data-s="' + esc(s) + '">' + esc(s) + '<span class="x">×</span></button>';
    });
  }
  html += '</div></div>';

  html += '<div class="subj-section">';
  html += '<div class="subj-head">可 选 <span class="hint-inline">· 点击加入已选</span>';
  html += '<span class="count">' + available.length + ' 个</span></div>';
  html += '<div class="subj-chips available" id="subjAvailableChips">';
  available.forEach(s => {
    const isCustom = customArr.indexOf(s) !== -1;
    html += '<button type="button" class="subj-chip available-chip' + (isCustom ? ' custom-flag' : '') + '" data-s="' + esc(s) + '">' + esc(s) + '</button>';
  });
  html += '<button type="button" class="subj-chip add" id="subjAddBtn">+ 添 加</button>';
  html += '</div></div>';

  containerEl.innerHTML = html;

  containerEl.querySelector('#subjSelectedChips').addEventListener('click', function(e){
    const btn = e.target.closest('.subj-chip');
    if(!btn) return;
    const name = btn.dataset.s;
    const idx = selectedArr.indexOf(name);
    if(idx === -1) return;
    selectedArr.splice(idx, 1);
    sfx.tap();
    onChange();
    renderSubjectPool(containerEl, selectedArr, customArr, onChange);
  });

  containerEl.querySelector('#subjAvailableChips').addEventListener('click', function(e){
    const addBtn = e.target.closest('#subjAddBtn');
    if(addBtn){
      sfx.tap();
      addCustomSubject(customArr, function(newName){
        if(selectedArr.indexOf(newName) === -1) selectedArr.push(newName);
        onChange();
        renderSubjectPool(containerEl, selectedArr, customArr, onChange);
      });
      return;
    }
    const btn = e.target.closest('.subj-chip');
    if(!btn || btn.classList.contains('add')) return;
    const name = btn.dataset.s;
    if(btn._longPressed){ btn._longPressed = false; return; }
    if(selectedArr.indexOf(name) === -1){
      selectedArr.push(name);
      sfx.tap();
      onChange();
      renderSubjectPool(containerEl, selectedArr, customArr, onChange);
    }
  });

  containerEl.querySelectorAll('#subjAvailableChips .subj-chip.custom-flag').forEach(chip => {
    let timer = null;
    const name = chip.dataset.s;
    const start = () => {
      timer = setTimeout(() => {
        chip._longPressed = true;
        if(confirm('删除自定义科目「' + name + '」？')){
          const i = customArr.indexOf(name);
          if(i !== -1) customArr.splice(i, 1);
          const j = selectedArr.indexOf(name);
          if(j !== -1) selectedArr.splice(j, 1);
          sfx.tap();
          onChange();
          renderSubjectPool(containerEl, selectedArr, customArr, onChange);
        }
      }, 600);
    };
    const cancel = () => { clearTimeout(timer); };
    chip.addEventListener('touchstart', start, {passive:true});
    chip.addEventListener('touchend', cancel);
    chip.addEventListener('touchmove', cancel);
    chip.addEventListener('mousedown', start);
    chip.addEventListener('mouseup', cancel);
    chip.addEventListener('mouseleave', cancel);
  });
}

function addCustomSubject(customArr, cb){
  const name = prompt('请输入科目名称（如：量子力学、中医基础、韩语）');
  if(!name) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  if(trimmed.length > 20){ toast('科目名称太长啦（不超过20字）'); return; }
  const all = BASE_SUBJECTS.concat(customArr);
  if(all.indexOf(trimmed) !== -1){ toast('「' + trimmed + '」已经存在了'); return; }
  customArr.push(trimmed);
  toast('已添加：' + trimmed);
  if(cb) cb(trimmed);
}

function renderQuestion(){
  stage.style.display = 'block';
  const q = current;
  answered = false;
  const letters = ['A','B','C','D','E','F'];
  const diffClassMap = { '入门':'', '简单':'', '基础':'c', '中等':'p', '进阶':'p', '困难':'g', '地狱':'r' };
  const diffClass = diffClassMap[state.diff] || '';
  const displaySubject = q._subject || '全随机';

  let html = '<div class="card">';
  html += '<div class="meta">';
  html += '<span class="chip p">' + esc(displaySubject) + '</span>';
  html += '<span class="chip ' + diffClass + '">' + esc(state.diff) + '</span>';
  html += '<span class="chip c">' + (TYPE_NAME_MAP[q.type] || '题目') + '</span>';
  if(q.type === 'short'){
    html += '<span class="chip' + (state.shortIntensity === '相关文章' ? ' g' : '') + '">' + esc(state.shortIntensity) + '</span>';
  }
  html += '<span class="chip">第 ' + (session.total + 1) + ' 题</span>';
  html += '</div>';
  html += '<p class="q-text">' + esc(q.question) + '</p>';

  html += '<div class="hint-row" id="hintRow">';
  if(q.hint){
    html += '<button class="hint-btn" id="hintBtn" type="button">💡 看 微 提 示</button>';
  }
  html += '</div>';

  if(q.type === 'choice'){
    html += '<div class="options" id="opts">';
    q.options.forEach((opt, i)=>{
      html += '<button class="opt" data-i="' + i + '">' +
                '<span class="k">' + (letters[i] || i+1) + '</span>' +
                '<span>' + esc(opt) + '</span>' +
              '</button>';
    });
    html += '</div>';
  }else if(q.type === 'fill'){
    html += '<div class="fill-row">' +
              '<input type="text" id="fillInput" placeholder="输入答案" autocomplete="off" spellcheck="false" enterkeyhint="done">' +
              '<button class="btn primary" id="submitBtn">提交</button>' +
            '</div>';
  }else{
    const essay = state.shortIntensity === '相关文章';
    const desc = SHORT_INTENSITY_DESC[state.shortIntensity] || '';
    const ph = essay ? '请在这里完成你的文章…（' + ESSAY_RANGE.min + '-' + ESSAY_RANGE.max + ' 字）' : '请在这里作答…';
    html += '<textarea class="short-ta' + (essay ? ' essay' : '') + '" id="shortInput" placeholder="' + esc(ph) + '" spellcheck="false"></textarea>';
    html += '<div class="short-meta">期望强度：' + esc(state.shortIntensity) + ' · ' + esc(desc) +
            '<span class="short-char-count" id="charCount">0 字</span></div>';
    html += '<button class="btn primary block" id="shortSubmitBtn">' + (essay ? '提 交 文 章 并 评 分' : '提 交 并 评 分') + '</button>';
  }

  html += '<div id="fbSlot"></div>';
  html += '</div>';
  stage.innerHTML = html;

  const hintBtn = $('hintBtn');
  if(hintBtn){
    hintBtn.addEventListener('click', function(){
      sfx.hint();
      $('hintRow').innerHTML =
        '<div class="hint-box"><div class="h-head">💡 微 提 示</div><div>' + esc(q.hint) + '</div></div>';
    });
  }

  if(q.type === 'choice'){
    $('opts').addEventListener('click', function(e){
      const btn = e.target.closest('.opt');
      if(!btn || answered) return;
      onChoose(parseInt(btn.dataset.i, 10));
    });
  }else if(q.type === 'fill'){
    const inp = $('fillInput');
    $('submitBtn').addEventListener('click', submitFill);
    inp.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); submitFill(); }
    });
    setTimeout(()=>{ try{ inp.focus({preventScroll:false}); }catch(e){} }, 220);
  }else{
    const inp = $('shortInput');
    const cc = $('charCount');
    const essay = state.shortIntensity === '相关文章';
    const update = () => {
      if(!cc) return;
      cc.textContent = inp.value.length + ' 字';
      cc.classList.remove('near', 'over');
      if(essay){
        if(inp.value.length >= ESSAY_RANGE.min) cc.classList.add('near');
        if(inp.value.length > ESSAY_RANGE.max * 1.3) cc.classList.add('over');
      }
    };
    inp.addEventListener('input', update);
    $('shortSubmitBtn').addEventListener('click', submitShort);
    setTimeout(()=>{ try{ inp.focus({preventScroll:false}); }catch(e){} }, 220);
  }
}

function onChoose(idx){
  if(answered) return;
  answered = true;
  const q = current;
  const ok = idx === q.answer;
  stage.querySelectorAll('.opt').forEach((el, i)=>{
    el.classList.add('done');
    if(i === q.answer) el.classList.add('right');
    else if(i === idx) el.classList.add('wrong');
  });
  finishAnswer(ok, q.options[q.answer], q.options[idx]);
}

function submitFill(){
  if(answered) return;
  const inp = $('fillInput');
  if(!inp) return;
  const val = inp.value.trim();
  if(!val){ inp.focus(); return; }
  answered = true;
  inp.disabled = true;
  if($('submitBtn')) $('submitBtn').disabled = true;
  const q = current;
  const ok = isAnswerMatch(val, q);
  finishAnswer(ok, q.answer, val);
}

async function submitShort(){
  if(answered) return;
  const inp = $('shortInput');
  const btn = $('shortSubmitBtn');
  if(!inp) return;
  const val = inp.value.trim();
  const essay = state.shortIntensity === '相关文章';
  const minLen = essay ? 100 : 3;
  if(val.length < minLen){
    toast(essay ? '文章太短了，至少写 100 字' : '请至少写 3 个字');
    inp.focus();
    return;
  }

  answered = true;
  inp.disabled = true;
  if(btn){ btn.disabled = true; btn.textContent = essay ? 'AI 正在批阅文章…' : 'AI 批改中…'; }

  const q = current;
  try{
    const grade = await gradeShortAnswer(q, val);
    finishShortAnswer(grade, q, val);
  }catch(e){
    answered = false;
    inp.disabled = false;
    if(btn){ btn.disabled = false; btn.textContent = essay ? '提 交 文 章 并 评 分' : '提 交 并 评 分'; }
    toast(e.message || '批改失败，请重试');
  }
}

function finishShortAnswer(grade, q, userText){
  const ok = grade.score >= grade.total * 0.6;
  session.total++;
  if(ok) session.right++; else session.wrong++;
  updateStats();

  history.unshift({
    t: Date.now(), q: q.question, type: 'short',
    subject: q._subject || '全随机', diff: state.diff,
    ok: ok, user: userText, correct: q.answerPoints.join(' · '),
    score: grade.score, total: grade.total, comment: grade.comment,
    essay: state.shortIntensity === '相关文章'
  });
  if(history.length > MAX_HISTORY) history.length = MAX_HISTORY;
  saveHistory();

  if(ok) sfx.right(); else sfx.wrong();

  const slot = $('fbSlot');
  if(!slot) return;

  let html = '<div class="short-result ' + (ok ? 'ok' : 'no') + '">';
  html += '<div class="score-row">';
  html += '<span class="score-big">' + grade.score + '</span>';
  html += '<span class="score-total">/' + grade.total + '</span>';
  html += '<span class="score-tag">' + (ok ? '合格' : '未达标') + '</span>';
  html += '</div>';
  if(grade.comment){
    html += '<div class="comment">' + esc(grade.comment) + '</div>';
  }
  html += '<div class="ans-points">';
  html += '<div class="ap-head">' + (state.shortIntensity === '相关文章' ? '优 秀 文 章 要 素' : '参 考 答 案 要 点') + '</div>';
  q.answerPoints.forEach((p, i) => {
    html += '<div class="ap-item">' + (i + 1) + '. ' + esc(p) + '</div>';
  });
  html += '</div>';
  if(q.explanation){
    html += '<div class="explain-body">💡 ' + esc(q.explanation) + '</div>';
  }
  html += '</div>';

  html += '<button class="btn primary block" id="nextBtn" style="margin-top:14px">下 一 题</button>';
  slot.innerHTML = html;

  $('nextBtn').addEventListener('click', ()=>{ sfx.tap(); nextQuestion(false); });
  setTimeout(()=>{ try{ slot.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){} }, 100);
  fillQueue();
}

function finishAnswer(ok, correctText, userText){
  const q = current;
  session.total++;
  if(ok) session.right++; else session.wrong++;
  updateStats();

  history.unshift({
    t: Date.now(), q: q.question, type: q.type,
    subject: q._subject || '全随机', diff: state.diff,
    ok: ok, user: userText || '', correct: correctText
  });
  if(history.length > MAX_HISTORY) history.length = MAX_HISTORY;
  saveHistory();

  if(ok) sfx.right(); else sfx.wrong();

  const slot = $('fbSlot');
  if(!slot) return;
  let html = '<div class="explain ' + (ok ? 'ok' : 'no') + '">';
  html += '<div class="head">' + (ok ? '✓ 回答正确' : '✗ 回答错误') + '</div>';
  if(!ok) html += '<div style="margin-bottom:6px">正确答案：<span class="ans">' + esc(correctText) + '</span></div>';
  if(q.explanation) html += '<div class="body">💡 ' + esc(q.explanation) + '</div>';
  if(ok && q.type === 'fill' && Array.isArray(q.aliases) && q.aliases.length){
    html += '<div class="alias">其他等价答案也接受：' + q.aliases.map(esc).join(' / ') + '</div>';
  }
  html += '</div>';
  html += '<button class="btn primary block" id="nextBtn" style="margin-top:14px">下 一 题</button>';
  slot.innerHTML = html;

  $('nextBtn').addEventListener('click', ()=>{ sfx.tap(); nextQuestion(false); });
  setTimeout(()=>{ try{ slot.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){} }, 100);
  fillQueue();
}

function updateStats(){
  $('statsBox').style.display = 'block';
  $('stTotal').textContent = session.total;
  $('stRight').textContent = session.right;
  $('stWrong').textContent = session.wrong;
  $('stRate').textContent = session.total
    ? Math.round(session.right / session.total * 100) + '%'
    : '—';
}

async function nextQuestion(isRetry){
  if(!state.apiKey){ renderIntro(); return; }
  if(!state.selectedSubjects.length){
    renderError('请先在设置里至少选择一个科目');
    return;
  }
  if(!state.types.length){
    renderError('请先在设置里至少选择一种题型');
    return;
  }
  if(!isRetry && queue.length > 0){
    current = queue.shift();
    renderQuestion();
    fillQueue();
    return;
  }
  renderLoading('AI 正在出题', '正在为你生成新题目…');
  try{
    const subjectName = pickRandomSubject(state.selectedSubjects);
    const qs = await generateQuestions(2, subjectName);
    queue = queue.concat(qs);
    current = queue.shift();
    renderQuestion();
  }catch(e){
    renderError(e.message || '网络异常，请重试');
  }
}

function renderExplanationHTML(text){
  const lines = String(text).split(/\n+/).filter(l => l.trim());
  return lines.map(line => {
    const t = line.trim();
    if(/^【.+】$/.test(t)) return '<h4 class="exp-h">' + esc(t) + '</h4>';
    if(/^[-•·]\s/.test(t)) return '<div class="exp-li">• ' + esc(t.replace(/^[-•·]\s/,'')) + '</div>';
    return '<p class="exp-p">' + esc(t) + '</p>';
  }).join('');
}

    ? '关键词/主题：' + studyFilters.keyword + '（请围绕这个主题生成紧密相关的知识点）'

  return [

`请根据以下条件，生成 8 个互相独立、覆盖不同角度的知识点。

学科：${subject}
学业等级：${studyFilters.grade} —— ${gradeDesc}
${kwLine}

请返回 JSON：
{
  "points": [
    { "title": "知识点标题", "brief": "一句话简介", "tags": ["标签1", "标签2"] }
  ]
}` }

async function generateStudyPoints(){
  if(studyLoading) return;
  if(!studyFilters.selectedSubjects.length){ toast('请至少选择一个科目'); return; }
  studyLoading = true;
  studyPoints = [];
  studyCurrent = null;
  renderStudyList();
  try{
    const subjectName = pickRandomSubject(studyFilters.selectedSubjects);
    const raw = await callAPI(buildPointsPrompt(subjectName), true);
    const data = extractJSON(raw);
    let list = data && (data.points || data.list || data.data);
    if(!Array.isArray(list)) list = [data];
    studyPoints = list.map(p => ({
      title: String(p.title || '').trim(),
      brief: String(p.brief || '').trim(),
      tags: Array.isArray(p.tags) ? p.tags.map(t=>String(t).trim()).filter(Boolean).slice(0,3) : [],
      explanation: '', exercises: [], _subject: subjectName
    })).filter(p => p.title);
    if(!studyPoints.length) throw new Error('未生成有效知识点');
    sfx.done();
  }catch(e){
    toast(e.message || '生成失败，请重试');
  }finally{
    studyLoading = false;
    renderStudyList();
  }
}

function buildExplainPrompt(p){
  const gradeDesc = GRADE_DESC[studyFilters.grade] || studyFilters.grade;
  const explainDiffDesc = EXPLAIN_DIFF_DESC[studyFilters.explainDiff] || studyFilters.explainDiff;
  const explainDepthDesc = EXPLAIN_DEPTH_DESC[studyFilters.explainDepth] || studyFilters.explainDepth;
  const subjectName = p._subject || pickRandomSubject(studyFilters.selectedSubjects);
  return [
    { role: 'system', content: '你是一位资深教师，擅长用恰当的语言深度讲解知识点。你只返回 JSON，不返回任何多余文字。' },
    { role: 'user', content:
`请对以下知识点做一次讲解。

学科：${subjectToPromptDesc(subjectName)}
学业等级：${studyFilters.grade} —— ${gradeDesc}
知识点：${p.title}
简介：${p.brief}

【讲解难度】：${studyFilters.explainDiff}
${explainDiffDesc}

【讲解深度】：${studyFilters.explainDepth}
${explainDepthDesc}

要求：
1. 严格遵守讲解难度和深度要求，两者同时满足
2. 分小节，每节以【小标题】开头（用中文方括号）
3. 用换行分段
4. 不要使用 Markdown 语法

请返回 JSON：{ "explanation": "讲解正文" }` }
  ];
}

async function openStudyPoint(idx){
  const p = studyPoints[idx];
  if(!p) return;
  studyCurrent = p;
  showStudyDetail();
  if(!p.explanation){ await generateExplanation(p); }
}

async function generateExplanation(p){
  studyLoading = true;
  renderStudyDetail();
  try{
    const raw = await callAPI(buildExplainPrompt(p), true);
    const data = extractJSON(raw);
    p.explanation = String(data.explanation || data.text || data.content || '').trim();
    if(!p.explanation) throw new Error('讲解生成失败');
    sfx.done();
  }catch(e){
    toast(e.message || '讲解生成失败');
    p.explanation = '';
  }finally{
    studyLoading = false;
    renderStudyDetail();
  }
}

function buildExercisePrompt(p){
  const gradeDesc = GRADE_DESC[studyFilters.grade] || studyFilters.grade;
  const expBrief = p.explanation ? p.explanation.slice(0, 400) : p.brief;
  const subjectName = p._subject || pickRandomSubject(studyFilters.selectedSubjects);
  return [
    { role: 'system', content: '你是一位资深出题老师，你只返回 JSON，不返回任何多余文字。' },
    { role: 'user', content:
`请基于以下知识点，出 3 道练习题。

学科：${subjectToPromptDesc(subjectName)}
学业等级：${studyFilters.grade} —— ${gradeDesc}
知识点：${p.title}
讲解摘要：${expBrief}

要求：
1. 题目要考察理解和迁移应用
2. 3 道题中：2 道选择题 + 1 道填空题
3. 每题都要有解析
4. 填空题要给 aliases 数组
5. 每题给一个 hint（微提示）

请返回 JSON：
{
  "questions": [
    { "question": "...", "type": "choice", "options": ["A","B","C","D"], "answer": 0, "hint": "...", "explanation": "..." },
    { "question": "...", "type": "fill", "answer": "...", "aliases": ["..."], "hint": "...", "explanation": "..." }
  ]
}` }
  ];
}

async function generateExercises(p){
  studyLoading = true;
  renderStudyDetail();
  try{
    const raw = await callAPI(buildExercisePrompt(p), true);
    const data = extractJSON(raw);
    let list = data && (data.questions || data.list || data.data);
    if(!Array.isArray(list)) list = [data];
    p.exercises = list.map(sanitizeQuestion).filter(Boolean).slice(0, 3);
    if(!p.exercises.length) throw new Error('练习生成失败');
    sfx.done();
  }catch(e){
    toast(e.message || '练习生成失败');
  }finally{
    studyLoading = false;
    renderStudyDetail();
  }
}

function renderStudyDetail(){
  if(!studyCurrent){ studyDetail.innerHTML = ''; return; }
  const p = studyCurrent;
  let html = '';
  html += '<div class="detail-head">';
  html += '<button class="back-btn" id="studyBackBtn" aria-label="返回">';
  html += '<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>';
  html += '</button>';
  html += '<h2>' + esc(p.title) + '</h2>';
  html += '</div>';

  html += '<div class="card" style="margin-bottom:14px">';
  html += '<div class="style-chips">';
  html += '<span class="sc">' + esc(p._subject || '全随机') + '</span>';
  html += '<span class="sc">' + esc(studyFilters.grade) + '</span>';
  html += '<span class="sc">' + esc(studyFilters.explainDiff) + '</span>';
  html += '<span class="sc">' + esc(studyFilters.explainDepth) + '</span>';
  html += '</div>';

  if(studyLoading && !p.explanation){
    html += '<div class="loading" style="padding:30px 20px"><div class="ring"></div><div class="txt">AI 正在生成讲解</div></div>';
  }else if(p.explanation){
    html += renderExplanationHTML(p.explanation);
  }else{
    html += '<div class="empty-hist"><div class="icon">📝</div>讲解生成失败<br><button class="btn sm" id="retryExpBtn" style="margin-top:12px">重 试</button></div>';
  }
  html += '</div>';

  if(p.explanation){
    html += '<div class="card">';
    html += '<div class="ex-section-title">🎯 举一反三</div>';
    if(studyLoading && !p.exercises.length){
      html += '<div style="text-align:center;padding:20px;color:var(--dim)">正在生成练习…</div>';
    }else if(p.exercises.length){
      html += '<div id="exList"></div>';
      html += '<button class="btn block" id="regenExBtn" style="margin-top:8px">再 来 一 组</button>';
    }else{
      html += '<p style="font-size:13px;color:var(--dim);line-height:1.8;margin:0 0 12px">看完讲解，用几道题巩固一下？</p>';
      html += '<button class="btn primary block" id="genExBtn">生 成 练 习</button>';
    }
    html += '</div>';
  }
  studyDetail.innerHTML = html;

  const backBtn = $('studyBackBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ sfx.tap(); showStudyList(); });
  const retryExpBtn = $('retryExpBtn');
  if(retryExpBtn) retryExpBtn.addEventListener('click', ()=>{ sfx.tap(); generateExplanation(p); });
  const genExBtn = $('genExBtn');
  if(genExBtn) genExBtn.addEventListener('click', ()=>{ sfx.tap(); generateExercises(p); });
  const regenExBtn = $('regenExBtn');
  if(regenExBtn) regenExBtn.addEventListener('click', ()=>{ sfx.tap(); p.exercises = []; generateExercises(p); });

  if(p.exercises.length) renderExercises(p.exercises);
}

function renderExercises(exs){
  const wrap = $('exList');
  if(!wrap) return;
  wrap.innerHTML = '';
  const letters = ['A','B','C','D','E','F'];

  exs.forEach((q, i)=>{
    const card = document.createElement('div');
    card.className = 'ex-card';
    let html = '<div class="ex-num">第 ' + (i + 1) + ' 题 · ' + (TYPE_NAME_MAP[q.type] || '题目') + '</div>';
    html += '<p class="ex-q">' + esc(q.question) + '</p>';

    if(q.type === 'choice'){
      html += '<div class="ex-opts">';
      q.options.forEach((o, j)=>{
        html += '<button class="ex-opt" data-i="' + j + '">' +
                  '<span class="k">' + (letters[j] || j+1) + '</span>' +
                  '<span>' + esc(o) + '</span>' +
                '</button>';
      });
      html += '</div>';
    }else{
      html += '<div class="ex-fill-row">' +
                '<input type="text" placeholder="输入答案" autocomplete="off" spellcheck="false">' +
                '<button type="button">提交</button>' +
              '</div>';
    }
    html += '<div class="ex-result-slot"></div>';
    card.innerHTML = html;
    wrap.appendChild(card);

    let answeredLocal = false;
    const finish = (ok, correctText, userText) => {
      if(answeredLocal) return;
      answeredLocal = true;
      history.unshift({
        t: Date.now(), q: q.question, type: q.type,
        subject: studyCurrent._subject || '全随机',
        diff: studyFilters.grade,
        ok: ok, user: userText || '', correct: correctText, from: 'study'
      });
      if(history.length > MAX_HISTORY) history.length = MAX_HISTORY;
      saveHistory();
      if(ok) sfx.right(); else sfx.wrong();
      const slot = card.querySelector('.ex-result-slot');
      let r = '<div class="ex-result ' + (ok ? 'ok' : 'no') + '">';
      r += '<div class="head">' + (ok ? '✓ 正确' : '✗ 错误') + '</div>';
      if(!ok) r += '<div>正确答案：<span class="ans">' + esc(correctText) + '</span></div>';
      if(q.explanation) r += '<div class="body">💡 ' + esc(q.explanation) + '</div>';
      r += '</div>';
      slot.innerHTML = r;
    };

    if(q.type === 'choice'){
      card.querySelector('.ex-opts').addEventListener('click', (e)=>{
        const btn = e.target.closest('.ex-opt');
        if(!btn || answeredLocal) return;
        const idx = parseInt(btn.dataset.i, 10);
        const ok = idx === q.answer;
        card.querySelectorAll('.ex-opt').forEach((el, j)=>{
          el.classList.add('done');
          if(j === q.answer) el.classList.add('right');
          else if(j === idx) el.classList.add('wrong');
        });
        finish(ok, q.options[q.answer], q.options[idx]);
      });
    }else{
      const inp = card.querySelector('input');
      const btn = card.querySelector('button');
      const submit = ()=>{
        if(answeredLocal) return;
        const val = inp.value.trim();
        if(!val){ inp.focus(); return; }
        inp.disabled = true; btn.disabled = true;
        const ok = isAnswerMatch(val, q);
        finish(ok, q.answer, val);
      };
      btn.addEventListener('click', submit);
      inp.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
    }
  });
}

  window.scrollTo({top:0, behavior:'smooth'});
}

function showStudyDetail(){
  studyList.style.display = 'none';
  studyDetail.style.display = 'block';
  renderStudyDetail();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderHistory(){
  const count = history.length;
  let html = '<div class="card" style="padding:18px 14px">';
  html += '<div class="hist-head">';
  html += '<h2>答题记录</h2>';
  html += '<span class="count">共 ' + count + ' 条</span>';
  html += '<button class="btn sm" id="clearHistBtn" style="margin-left:auto">清 空</button>';
  html += '</div>';

  if(!count){
    html += '<div class="empty-hist"><div class="icon">📋</div>还没有答题记录<br>去答几道题试试吧</div>';
  }else{
    html += '<div class="hist-list">';
    history.forEach(item => {
      const okCls = item.ok ? 'ok' : 'no';
      const okTxt = item.ok ? '✓ 正确' : '✗ 错误';
      const userShown = item.user ? esc(item.user) : '（跳过）';
      html += '<div class="hist-item">';
      html += '<div class="hist-top">';
      html += '<span class="hist-badge ' + okCls + '">' + okTxt + '</span>';
      if(item.type === 'short' && item.score !== undefined){
        html += '<span class="hist-badge score">' + item.score + '/' + item.total + '</span>';
      }
      html += '<span class="hist-subj">' + esc(item.subject || '—') + ' · ' + esc(item.diff || '—') +
              (item.from === 'study' ? ' · 练习' : '') +
              (item.type === 'short' ? (item.essay ? ' · 文章' : ' · 简答') : '') + '</span>';
      html += '<span class="hist-time">' + fmtTime(item.t) + '</span>';
      html += '</div>';
      html += '<p class="hist-q">' + esc(item.q) + '</p>';
      html += '<div class="hist-ans">';
      if(!item.ok) html += '你的答案：<span class="no">' + userShown + '</span> &nbsp;|&nbsp; ';
      html += (item.type === 'short' ? (item.essay ? '要素：' : '参考要点：') : '正确答案：') + '<span class="gold">' + esc(item.correct) + '</span>';
      html += '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  historyView.innerHTML = html;

  $('clearHistBtn').addEventListener('click', ()=>{
    if(!history.length) return;
    if(confirm('确定清空所有答题记录吗？')){
      history = [];
      saveHistory();
      sfx.tap();
      renderHistory();
    }
  });
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab === tab);
  });
  sfx.tap();

  stage.style.display = 'none';
  studyView.style.display = 'none';
  historyView.style.display = 'none';
  $('statsBox').style.display = 'none';

  if(tab === 'quiz'){
    stage.style.display = 'block';
    $('statsBox').style.display = session.total > 0 ? 'block' : 'none';
  }else if(tab === 'study'){
    studyView.style.display = 'block';
    showStudyList();
  }else{
    historyView.style.display = 'block';
    renderHistory();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function buildThemePicker(){
  const wrap = $('themePicker');
  wrap.innerHTML = '';
  THEMES.forEach(t=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'theme-btn' + (state.theme === t.id ? ' on' : '');
    b.dataset.theme = t.id;
    b.innerHTML =
      '<span class="theme-dot" style="background:linear-gradient(135deg,' + t.color1 + ',' + t.color2 + ')"></span>' +
      '<span class="theme-name">' + t.name + '</span>';
    b.addEventListener('click', ()=>{
      state.theme = t.id;
      applyTheme(t.id);
      saveCfg();
      wrap.querySelectorAll('.theme-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      sfx.tap();
    });
    wrap.appendChild(b);
  });
}

function updateShortIntensityVisibility(){
  const f = $('shortIntensityField');
  const hint = $('shortIntensityHint');
  if(!f) return;
  const hasShort = state.types.indexOf('short') !== -1;
  f.style.display = hasShort ? 'block' : 'none';
  if(hint){
    if(hasShort){
      const isEssay = state.shortIntensity === '相关文章';
      hint.innerHTML = '当前：<b style="color:' + (isEssay ? 'var(--gold)' : 'var(--purple)') + '">' + state.shortIntensity + '</b> · ' +
                      (SHORT_INTENSITY_DESC[state.shortIntensity] || '');
    }else{
      hint.textContent = '';
    }
  }
}

function buildPickers(){
  buildThemePicker();
  renderSubjectPool($('quizSubjectPool'), state.selectedSubjects, state.customSubjects, () => { saveCfg(); });

  const dp = $('diffPicker');
  dp.innerHTML = '';
  DIFFS.forEach(d=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip-pick' + (state.diff === d ? ' on' : '');
    b.textContent = d;
    b.addEventListener('click', ()=>{
      state.diff = d;
      dp.querySelectorAll('.chip-pick').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      sfx.tap();
    });
    dp.appendChild(b);
  });

  const tp = $('typePicker');
  tp.innerHTML = '';
  TYPE_OPTIONS.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip-pick' + (state.types.indexOf(t.id) !== -1 ? ' on' : '');
    b.textContent = t.label;
    b.addEventListener('click', () => {
      const i = state.types.indexOf(t.id);
      if(i === -1){
        state.types.push(t.id);
        b.classList.add('on');
      } else {
        if(state.types.length <= 1){
          toast('至少选一种题型');
          return;
        }
        state.types.splice(i, 1);
        b.classList.remove('on');
      }
      saveCfg();
      updateShortIntensityVisibility();
      sfx.tap();
    });
    tp.appendChild(b);
  });

  const sp = $('shortIntensityPicker');
  sp.innerHTML = '';
  SHORT_INTENSITIES.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip-pick' + (state.shortIntensity === s ? ' on' : '');
    if(s === '相关文章') b.style.fontSize = '11.5px';
    b.textContent = s;
    b.addEventListener('click', () => {
      state.shortIntensity = s;
      sp.querySelectorAll('.chip-pick').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      saveCfg();
      updateShortIntensityVisibility();
      sfx.tap();
    });
    sp.appendChild(b);
  });

  updateShortIntensityVisibility();
}

function updateMaskVal(){
  $('maskVal').textContent = state.bgMask + '%';
  document.documentElement.style.setProperty('--mask', (state.bgMask / 100).toFixed(2));
}

function applyBg(){
  const prev = $('bgPreview');
  if(state.bgDataUrl){
    bgLayer.style.backgroundImage = 'url(' + state.bgDataUrl + ')';
    bgLayer.classList.add('on');
    bgMask.classList.add('on');
    prev.style.backgroundImage = 'url(' + state.bgDataUrl + ')';
    prev.textContent = '';
    prev.classList.add('has-img');
  }else{
    bgLayer.style.backgroundImage = '';
    bgLayer.classList.remove('on');
    bgMask.classList.remove('on');
    prev.style.backgroundImage = '';
    prev.textContent = '未设置背景';
    prev.classList.remove('has-img');
  }
  updateMaskVal();
}

function compressImage(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let ioMode = 'export';

function openIO(mode){
  ioMode = mode;
  ioModal.classList.add('show');
  const ta = $('ioText');
  const title = $('ioTitle');
  const hint = $('ioHint');
  const primary = $('ioPrimary');

  if(mode === 'export'){
    title.textContent = '导出配置';
    hint.textContent = '把下面这段文本全部复制，保存到备忘录或聊天记录里。换环境时再用「导入配置」粘回来。背景图太大，不包含在内。';
    primary.textContent = '复 制 全 部';
    const payload = {
      version: 12,
      exportedAt: Date.now(),
      config: {
        apiKey: state.apiKey, baseUrl: state.baseUrl,
        theme: state.theme,
        selectedSubjects: state.selectedSubjects,
        customSubjects: state.customSubjects,
        types: state.types,
        shortIntensity: state.shortIntensity,
        diff: state.diff, bgMask: state.bgMask
      },
      studyFilters: studyFilters,
      history: history.slice(0, 100),
      seenQuestions: seenQuestions.slice(-200)
    };
    ta.value = JSON.stringify(payload);
    ta.select();
  }else{
    title.textContent = '导入配置';
    hint.textContent = '把之前导出的那段文本粘贴到下面，然后点「导入」。会覆盖当前的 API Key、配置和答题记录。';
    primary.textContent = '导 入';
    ta.value = '';
  }
}
function closeIO(){ ioModal.classList.remove('show'); }

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>false);
  }
  try{
    const ta = $('ioText');
    ta.value = text;
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    return Promise.resolve(ok);
  }catch(e){ return Promise.resolve(false); }
}

function doExport(){
  const ta = $('ioText');
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  copyText(ta.value).then(ok=>{
    if(ok){ sfx.done(); toast('已复制到剪贴板'); }
    else { toast('复制失败，请手动长按选择全部'); }
  });
}

function doImport(){
  const ta = $('ioText');
  const text = ta.value.trim();
  if(!text){ toast('请先粘贴配置文本'); return; }
  try{
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object') throw new Error('格式不对');

    if(data.config && typeof data.config === 'object'){
      const c = data.config;
      Object.keys(state).forEach(k=>{
        if(c[k] !== undefined) state[k] = c[k];
      });
      if(c.type !== undefined && c.types === undefined){
        if(c.type === '选择题') state.types = ['choice'];
        else if(c.type === '填空题') state.types = ['fill'];
        else state.types = ['choice', 'fill'];
      }
      if(c.subject !== undefined && !c.selectedSubjects){
        state.selectedSubjects = [c.subject];
      }
    }
    if(!Array.isArray(state.selectedSubjects) || !state.selectedSubjects.length){
      state.selectedSubjects = ['全随机'];
    }
    if(!Array.isArray(state.customSubjects)) state.customSubjects = [];
    if(!Array.isArray(state.types) || !state.types.length){
      state.types = ['choice', 'fill'];
    }
    state.types = state.types.filter(t => TYPE_OPTIONS.find(o => o.id === t));
    if(!state.types.length) state.types = ['choice'];
    if(SHORT_INTENSITIES.indexOf(state.shortIntensity) === -1) state.shortIntensity = '短篇';
    if(!THEMES.find(t => t.id === state.theme)) state.theme = 'purple';

    if(data.studyFilters && typeof data.studyFilters === 'object'){
      const sf = data.studyFilters;
      ['grade','explainDiff','explainDepth','keyword'].forEach(k=>{
        if(sf[k] !== undefined) studyFilters[k] = sf[k];
      });
      if(Array.isArray(sf.selectedSubjects)) studyFilters.selectedSubjects = sf.selectedSubjects;
      if(Array.isArray(sf.customSubjects)) studyFilters.customSubjects = sf.customSubjects;
    }
    if(!Array.isArray(studyFilters.selectedSubjects) || !studyFilters.selectedSubjects.length){
      studyFilters.selectedSubjects = ['全随机'];
    }
    if(!Array.isArray(studyFilters.customSubjects)) studyFilters.customSubjects = [];
    if(GRADES.indexOf(studyFilters.grade) === -1) studyFilters.grade = '高中';
    if(EXPLAIN_DIFFS.indexOf(studyFilters.explainDiff) === -1) studyFilters.explainDiff = '标准规范';
    if(EXPLAIN_DEPTHS.indexOf(studyFilters.explainDepth) === -1) studyFilters.explainDepth = '精讲细解';

    if(Array.isArray(data.history)) history = data.history.slice(0, MAX_HISTORY);
    if(Array.isArray(data.seenQuestions)) seenQuestions = data.seenQuestions.slice(-MAX_SEEN);

    saveCfg(); saveHistory(); saveSeen(); saveStudyFilter();
    applyTheme(state.theme);
    applyBg(); updateMaskVal();

    sfx.done();
    toast('导入成功');
    closeIO();

    $('inpKey').value = state.apiKey || '';
    $('inpBase').value = state.baseUrl;
    buildPickers();

    if(state.apiKey){
      queue = []; current = null;
      session = {total:0, right:0, wrong:0};
      updateStats();
      if(activeTab === 'quiz') nextQuestion(false);
    }else{
      if(activeTab === 'quiz') renderIntro();
    }
  }catch(e){
    toast('解析失败：' + (e.message || '格式错误'));
  }
}

$('closeBtn').addEventListener('click', ()=>{ sfx.tap(); closeModal(); });
$('exportBtn').addEventListener('click', ()=>{ sfx.tap(); openIO('export'); });
$('importBtn').addEventListener('click', ()=>{ sfx.tap(); openIO('import'); });
$('ioClose').addEventListener('click', ()=>{ sfx.tap(); closeIO(); });
$('ioPrimary').addEventListener('click', ()=>{ ioMode === 'export' ? doExport() : doImport(); });

modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
ioModal.addEventListener('click', function(e){ if(e.target === ioModal) closeIO(); });

$('eyeBtn').addEventListener('click', function(){
  const inp = $('inpKey');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  this.textContent = inp.type === 'password' ? '👁' : '🙈';
});

$('maskRange').addEventListener('input', function(){
  state.bgMask = parseInt(this.value, 10);
  updateMaskVal();
});

$('bgFile').addEventListener('change', async function(){
  const f = this.files && this.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('请选择图片文件'); return; }
  toast('正在压缩处理…');
  try{
    const data = await compressImage(f, 1280, 0.75);
    state.bgDataUrl = data;
    await idbSet('bg', data);
    applyBg();
    toast('背景已设置');
  }catch(e){ toast('图片处理失败，试试小一点的图片'); }
  this.value = '';
});

$('bgClear').addEventListener('click', async function(){
  state.bgDataUrl = '';
  await idbDel('bg');
  applyBg();
  sfx.tap();
  toast('背景已清除');
});

$('saveBtn').addEventListener('click', function(){
  initAudio();
  sfx.tap();
  const key = $('inpKey').value.trim();
  const base = $('inpBase').value.trim() || 'https://api.deepseek.com/v1';
  if(!key){ toast('请先填入 API Key'); return; }
  if(!state.selectedSubjects.length){ toast('请至少选择一个科目'); return; }
  if(!state.types.length){ toast('请至少选择一种题型'); return; }

  state.apiKey = key;
  state.baseUrl = base;
  saveCfg();
  closeModal();

  queue = []; current = null;
  session = {total:0, right:0, wrong:0};
  updateStats();

  if(activeTab === 'study') return;
  if(activeTab !== 'quiz') switchTab('quiz');
  nextQuestion(false);
});

document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ initAudio(); switchTab(b.dataset.tab); });
});

document.addEventListener('touchstart', function once(){
  initAudio();
  document.removeEventListener('touchstart', once);
}, {passive:true});
document.addEventListener('click', function once(){
  initAudio();
  document.removeEventListener('click', once);
});

async function boot(){
  loadCfg();
  loadHistory();
  loadSeen();
  loadStudyFilter();
  applyTheme(state.theme);
  buildPickers();
  updateMaskVal();

  try{
    const bg = await idbGet('bg');
    if(bg){ state.bgDataUrl = bg; }
  }catch(e){}
  applyBg();

  if(state.apiKey){
    nextQuestion(false);
  }else{
    renderIntro();
  }
}

boot();

})();
</script>
</body>
</html>
